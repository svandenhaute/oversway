# Alt+d (the default launcher key) toggles the overlay.
bindsym Mod1+d nop overlay_toggle

# While the overlay shows, oversway switches sway into this mode, so Alt+hjkl,
# Alt+digits and every other key reach the overlay. The daemon returns to the
# default mode on hide and on start. Alt+Shift+Escape is a manual way out.
mode "oversway" {
    bindsym Mod1+d nop overlay_toggle
    bindsym Mod1+Shift+Escape mode default
}

exec sh -c 'while :; do ~/sandbox/oversway/target/release/oversway >> ~/.local/state/oversway/log 2>&1; sleep 1; done'
