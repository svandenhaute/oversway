[package]
name = "oversway"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = "30"
glyphon = "0.12"
smithay-client-toolkit = "0.21"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
raw-window-handle = "0.6"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
nucleo-matcher = "0.3"
resvg = "0.45"
inotify = "0.11"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
nvml-wrapper = "0.13.0"

[profile.release]
debug = 1

[dev-dependencies]
wayland-protocols-misc = { version = "0.3", features = ["client"] }
xkbcommon = "0.8"
